name: Deploy comments API to Vercel

on:
  push:
    branches: [main]
    paths:
      - "waline-server/**"
      - ".github/workflows/deploy-comments.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comments-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: waline-server/package-lock.json
      - name: Deploy production comments API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --cwd waline-server --project aliouswe-comments
