name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore generated responsive images
        id: image-cache
        uses: actions/cache@v4
        with:
          path: |
            public/media
            public/image-manifest.json
            public/images
            public/anime
            public/coffee
          key: responsive-media-${{ runner.os }}-${{ hashFiles('src/assets/media/**', 'scripts/optimize-images.mjs') }}
          restore-keys: |
            responsive-media-${{ runner.os }}-
      - name: Detect changed source images
        if: steps.image-cache.outputs.cache-hit != 'true' && hashFiles('public/image-manifest.json') != ''
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed_paths="$RUNNER_TEMP/changed-media-paths"
          : > "$changed_paths"
          if [[ "$GITHUB_EVENT_NAME" == "push" \
            && -n "$BASE_SHA" \
            && "$BASE_SHA" != "0000000000000000000000000000000000000000" \
            && $(git cat-file -t "$BASE_SHA" 2>/dev/null) == "commit" ]]; then
            git diff --name-only --diff-filter=ACMRTD -z "$BASE_SHA" "$HEAD_SHA" -- src/assets/media > "$changed_paths"
            echo "IMAGE_CHANGED_PATHS_FILE=$changed_paths" >> "$GITHUB_ENV"
          fi
      - run: npm run build
        env:
          IMAGE_PIPELINE_CONCURRENCY: 3
          SKIP_IMAGE_OPTIMIZATION: ${{ steps.image-cache.outputs.cache-hit }}
          PUBLIC_WALINE_SERVER_URL: ${{ vars.PUBLIC_WALINE_SERVER_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_FORMSPREE_FORM_ID: ${{ vars.PUBLIC_FORMSPREE_FORM_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
