<script>
  (() => {
    const root = document.documentElement;
    const body = document.body;
    const cursorFx = document.querySelector('.cursor-fx');
    const header = document.querySelector('.header');
    const coarsePointer = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    let hideTimer;

    const pathname = window.location.pathname.replace(/index\.html$/, '').replace(/\/+$/, '');
    const route = pathname.split('/').filter(Boolean)[0] || 'home';
    body.classList.add(`route-${route}`);

    const revealNav = () => {
      if (!header || coarsePointer) return;
      clearTimeout(hideTimer);
      body.classList.add('nav-reveal');
    };

    const queueHideNav = () => {
      if (!header || coarsePointer) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!header.matches(':hover')) body.classList.remove('nav-reveal');
      }, 260);
    };

    const pointerMove = event => {
      if (cursorFx) {
        root.style.setProperty('--mx', `${event.clientX}px`);
        root.style.setProperty('--my', `${event.clientY}px`);
        cursorFx.classList.add('is-active');
      }
      if (event.clientY <= 92) revealNav();
      else queueHideNav();
    };

    if (coarsePointer) body.classList.add('nav-reveal');
    else body.classList.remove('nav-reveal');

    window.addEventListener('pointermove', pointerMove, { passive: true });
    window.addEventListener('pointerdown', pointerMove, { passive: true });
    window.addEventListener('pointerleave', () => cursorFx && cursorFx.classList.remove('is-active'), { passive: true });

    if (header && !coarsePointer) {
      header.addEventListener('mouseenter', revealNav);
      header.addEventListener('mouseleave', queueHideNav);
    }

    window.addEventListener('keydown', event => {
      if (event.key === 'Tab') body.classList.add('nav-reveal');
    });
  })();
</script>
