<script>
  (() => {
    const root = document.documentElement;
    const body = document.body;
    const cursorFx = document.querySelector('.cursor-fx');
    const header = document.querySelector('.header');
    const coarsePointer = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    let hideTimer;
    let destroyToc = null;
    const immersiveStorageKey = 'hexoo-immersive-reading';

    const pathname = window.location.pathname.replace(/index\.html$/, '').replace(/\/+$/, '');
    const route = pathname.split('/').filter(Boolean)[0] || 'home';
    body.classList.add(`route-${route}`);

    const revealNav = () => {
      if (!header || coarsePointer) return;
      clearTimeout(hideTimer);
      body.classList.add('nav-reveal');
    };

    const queueHideNav = () => {
      if (!header || coarsePointer) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!header.matches(':hover')) body.classList.remove('nav-reveal');
      }, 260);
    };

    const pointerMove = event => {
      if (cursorFx) {
        root.style.setProperty('--mx', `${event.clientX}px`);
        root.style.setProperty('--my', `${event.clientY}px`);
        cursorFx.classList.add('is-active');
      }
      if (event.clientY <= 92) revealNav();
      else queueHideNav();
    };

    if (coarsePointer) body.classList.add('nav-reveal');
    else body.classList.remove('nav-reveal');

    window.addEventListener('pointermove', pointerMove, { passive: true });
    window.addEventListener('pointerdown', pointerMove, { passive: true });
    window.addEventListener('pointerleave', () => cursorFx && cursorFx.classList.remove('is-active'), { passive: true });

    if (header && !coarsePointer) {
      header.addEventListener('mouseenter', revealNav);
      header.addEventListener('mouseleave', queueHideNav);
    }

    window.addEventListener('keydown', event => {
      if (event.key === 'Tab') body.classList.add('nav-reveal');
    });

    const labels = {
      tocTitle    : '\u76ee\u5f55',
      immersiveOn : '\u6c89\u6d78\u9605\u8bfb',
      immersiveOff: '\u9000\u51fa\u6c89\u6d78',
      showToc     : '\u663e\u793a\u76ee\u5f55',
      section     : '\u7ae0\u8282',
      fold        : '\u6298\u53e0'
    };

    const buildSlug = (text, index) => {
      const normalized = (text || '')
        .trim()
        .toLowerCase()
        .replace(/[^\w\u4e00-\u9fff\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
      return normalized || `section-${index + 1}`;
    };

    const initArticleToc = () => {
      if (typeof destroyToc === 'function') {
        destroyToc();
        destroyToc = null;
      }

      document.querySelectorAll('.article-toc-panel, .article-toc-reopen').forEach(node => node.remove());
      body.classList.remove('toc-ready', 'toc-layout-hidden');

      const postBody = document.querySelector('.post-body');
      if (!postBody || !document.querySelector('.main-inner.post')) return;

      const headings = Array.from(postBody.querySelectorAll('h1, h2, h3, h4'));
      if (headings.length < 2) return;

      const usedIds = new Set();
      headings.forEach((heading, index) => {
        if (!heading.id) {
          const base = buildSlug(heading.textContent, index);
          let id = base;
          let suffix = 2;
          while (usedIds.has(id) || document.getElementById(id)) {
            id = `${base}-${suffix++}`;
          }
          heading.id = id;
        }
        usedIds.add(heading.id);
      });

      const tocPanel = document.createElement('aside');
      tocPanel.className = 'article-toc-panel';
      tocPanel.setAttribute('aria-label', labels.tocTitle);
      tocPanel.innerHTML = `
        <div class="article-toc-header">
          <span class="article-toc-title">${labels.tocTitle}</span>
          <button class="article-toc-toggle" type="button">${labels.immersiveOn}</button>
        </div>
        <div class="article-toc-tree-wrap"></div>
      `;

      const linkMap = new Map();
      const nodeMetaMap = new Map();

      const tocRoot = { level: 0, children: [] };
      const stack = [tocRoot];
      headings.forEach((heading, index) => {
        const level = Number(heading.tagName.slice(1));
        const node = {
          id      : heading.id,
          level   : Math.min(Math.max(level, 1), 4),
          text    : heading.textContent.trim() || `${labels.section} ${index + 1}`,
          heading,
          children: []
        };
        while (stack.length > 1 && node.level <= stack[stack.length - 1].level) stack.pop();
        stack[stack.length - 1].children.push(node);
        stack.push(node);
      });

      const setCollapsedState = (item, collapsed) => {
        if (!item) return;
        item.classList.toggle('is-collapsed', collapsed);
        const button = item.querySelector(':scope > .article-toc-row .article-toc-fold-btn');
        if (button) button.setAttribute('aria-expanded', String(!collapsed));
      };

      const renderTree = (nodes, parentId = '') => {
        const list = document.createElement('ul');
        list.className = 'article-toc-tree';

        nodes.forEach(node => {
          const item = document.createElement('li');
          item.className = 'article-toc-node';
          item.dataset.level = String(node.level);
          item.dataset.id = node.id;

          const row = document.createElement('div');
          row.className = 'article-toc-row';

          if (node.children.length) {
            const foldButton = document.createElement('button');
            foldButton.className = 'article-toc-fold-btn';
            foldButton.type = 'button';
            foldButton.setAttribute('aria-label', labels.fold);
            foldButton.setAttribute('aria-expanded', 'true');
            foldButton.innerHTML = '<span class="article-toc-fold-icon"></span>';
            foldButton.addEventListener('click', event => {
              event.preventDefault();
              event.stopPropagation();
              setCollapsedState(item, !item.classList.contains('is-collapsed'));
            });
            row.appendChild(foldButton);
          } else {
            const spacer = document.createElement('span');
            spacer.className = 'article-toc-fold-spacer';
            row.appendChild(spacer);
          }

          const link = document.createElement('a');
          link.className = 'article-toc-link';
          link.href = `#${node.id}`;
          link.textContent = node.text;
          link.addEventListener('click', event => {
            event.preventDefault();
            node.heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', `#${node.id}`);
            setActiveLink(node.id);
          });

          row.appendChild(link);
          item.appendChild(row);

          if (node.children.length) item.appendChild(renderTree(node.children, node.id));

          list.appendChild(item);
          linkMap.set(node.id, link);
          nodeMetaMap.set(node.id, { item, parentId });
        });

        return list;
      };

      const treeWrap = tocPanel.querySelector('.article-toc-tree-wrap');
      treeWrap.appendChild(renderTree(tocRoot.children));

      const reopenButton = document.createElement('button');
      reopenButton.className = 'article-toc-reopen';
      reopenButton.type = 'button';
      reopenButton.textContent = labels.showToc;

      const toggleButton = tocPanel.querySelector('.article-toc-toggle');
      const setImmersiveMode = on => {
        body.classList.toggle('immersive-reading', on);
        if (on) localStorage.setItem(immersiveStorageKey, '1');
        else localStorage.removeItem(immersiveStorageKey);
        toggleButton.textContent = on ? labels.immersiveOff : labels.immersiveOn;
      };

      toggleButton.addEventListener('click', () => {
        setImmersiveMode(!body.classList.contains('immersive-reading'));
      });

      reopenButton.addEventListener('click', () => setImmersiveMode(false));

      document.body.appendChild(tocPanel);
      document.body.appendChild(reopenButton);
      body.classList.add('toc-ready');

      const positionToc = () => {
        if (window.innerWidth < 1200) {
          body.classList.add('toc-layout-hidden');
          return;
        }

        const postInner = document.querySelector('.main-inner.post');
        if (!postInner) return;

        const rect = postInner.getBoundingClientRect();
        const gap = 42;
        const leftBoundary = 12;
        const maxWidth = 240;
        const minWidth = 180;
        const available = rect.left - gap - leftBoundary;

        if (available < minWidth) {
          body.classList.add('toc-layout-hidden');
          return;
        }

        body.classList.remove('toc-layout-hidden');
        const panelWidth = Math.min(maxWidth, available);
        const left = Math.max(leftBoundary, rect.left - panelWidth - gap);

        tocPanel.style.width = `${Math.floor(panelWidth)}px`;
        tocPanel.style.left = `${left}px`;
        reopenButton.style.left = `${left}px`;
      };

      let activeId = '';
      const setActiveLink = id => {
        if (!id || id === activeId) return;

        if (activeId && linkMap.has(activeId)) linkMap.get(activeId).classList.remove('is-active');
        activeId = id;
        if (linkMap.has(activeId)) linkMap.get(activeId).classList.add('is-active');

        let parentId = nodeMetaMap.get(activeId)?.parentId;
        while (parentId) {
          const parentMeta = nodeMetaMap.get(parentId);
          if (!parentMeta) break;
          setCollapsedState(parentMeta.item, false);
          parentId = parentMeta.parentId;
        }
      };

      const updateActiveFromScroll = () => {
        let current = headings[0];
        for (const heading of headings) {
          if (heading.getBoundingClientRect().top <= 140) current = heading;
          else break;
        }
        setActiveLink(current.id);
      };

      let rafPending = false;
      const onScroll = () => {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => {
          updateActiveFromScroll();
          rafPending = false;
        });
      };
      const onResize = () => positionToc();

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onResize, { passive: true });
      window.addEventListener('load', onResize, { passive: true });

      positionToc();
      updateActiveFromScroll();
      setImmersiveMode(localStorage.getItem(immersiveStorageKey) === '1');

      destroyToc = () => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('resize', onResize);
        window.removeEventListener('load', onResize);
        body.classList.remove('toc-layout-hidden');
        tocPanel.remove();
        reopenButton.remove();
      };
    };

    initArticleToc();
    document.addEventListener('pjax:success', initArticleToc);
  })();
</script>
