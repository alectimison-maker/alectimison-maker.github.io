<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">神经网络的输入层、隐藏层和输出层</title>
<desc id="desc">一个全连接前馈神经网络示意图：4个输入节点连接到两个隐藏层，最后连到3个输出节点。每个节点表示一个神经元，连线表示可学习的权重。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#71849b"/>
  </marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #18304b; }
    .title { font-size: 29px; font-weight: 700; }
    .sub { font-size: 16px; fill: #61738a; }
    .layer { font-size: 19px; font-weight: 700; }
    .count { font-size: 14px; fill: #61738a; }
    .node-label { font-size: 16px; font-weight: 600; }
    .note { font-size: 15px; fill: #40556d; }
    .formula { font-size: 21px; font-weight: 600; }
  </style>
</defs>
